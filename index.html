<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ARCHIVE — 追星紀錄總覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f2ec; --ink:#15130f; --ink-dim:#56503f; --ink-faint:#96907d;
    --line: rgba(21,19,15,0.14); --line-strong: rgba(21,19,15,0.32);
    --rose:#c15b79; --teal:#2f6f62; --press:#cc2036;
    --display:'Archivo Black','Zen Maru Gothic',serif;
    --maru:'Zen Maru Gothic',sans-serif;
    --mono:'Zen Maru Gothic',monospace;
  }
  html[data-theme="dark"]{
    --paper:#17150f; --ink:#f2efe6; --ink-dim:#b6ad9a; --ink-faint:#736b58;
    --line: rgba(242,239,230,0.14); --line-strong: rgba(242,239,230,0.32);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--maru);
    min-height:100vh; transition:background-color .2s, color .2s;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:820px; margin:0 auto; padding:0 28px;}
  .cover{min-height:100vh; display:flex; flex-direction:column; justify-content:space-between; padding:36px 0 48px;}

  .masthead{display:flex; justify-content:space-between; align-items:baseline; font-family:var(--mono); font-size:11px; letter-spacing:0.08em; color:var(--ink-dim);}
  .masthead .issue{background:var(--ink); color:var(--paper); padding:3px 9px;}

  .hero{text-align:center; padding:64px 0 40px;}
  .hero .kicker{font-family:var(--mono); font-size:12px; letter-spacing:0.24em; color:var(--ink-dim); margin-bottom:16px;}
  .hero h1{font-family:var(--display); font-size:clamp(40px,9vw,84px); line-height:0.92; letter-spacing:0.01em;}
  .hero p{font-family:var(--maru); font-weight:500; color:var(--ink-dim); font-size:clamp(13px,1.6vw,16px); margin-top:16px; max-width:440px; margin-left:auto; margin-right:auto;}

  .index{border-top:1px solid var(--line-strong);}
  .entry{
    display:flex; align-items:center; gap:22px;
    padding:26px 0; border-bottom:1px solid var(--line);
    text-decoration:none; color:inherit; position:relative;
  }
  .entry .num{font-family:var(--display); font-size:22px; color:var(--ink-faint); flex:0 0 34px;}
  .entry .body{flex:1; min-width:0;}
  .entry .title{font-family:var(--display); font-size:clamp(19px,3vw,26px); letter-spacing:0.01em;}
  .entry .desc{font-family:var(--maru); font-size:13px; color:var(--ink-dim); margin-top:4px;}
  .entry .arrow{font-size:20px; color:var(--ink-faint); flex:0 0 auto; transition:transform .18s;}
  .entry:hover .arrow{transform:translateX(4px); color:var(--accent);}
  .entry:hover .title{color:var(--accent);}
  .entry[data-x="diary"]{--accent:var(--rose);}
  .entry[data-x="drama"]{--accent:var(--teal);}
  .entry[data-x="photo"]{--accent:var(--press);}
  .entry .dot{width:7px;height:7px;border-radius:50%; background:var(--accent); flex:0 0 auto; margin-right:2px;}

  .entry.disabled{cursor:default; opacity:0.62;}
  .entry.disabled .title{color:var(--ink);}
  .soon{font-family:var(--mono); font-size:10px; letter-spacing:0.08em; color:var(--paper); background:var(--ink-dim); padding:2px 7px; margin-left:8px; vertical-align:middle;}

  footer{font-family:var(--mono); font-size:11px; letter-spacing:0.06em; color:var(--ink-faint); text-align:center; padding-top:44px;}

  @media (max-width:520px){
    .wrap{padding:0 20px;}
    .entry{gap:14px; padding:20px 0;}
    .entry .num{font-size:17px; flex-basis:26px;}
  }
</style>
</head>
<body>
<div class="wrap cover">

  <div class="masthead">
    <span>PERSONAL ARCHIVE</span>
    <span class="issue" id="issueTag"></span>
  </div>

  <div class="hero">
    <div class="kicker">追星生活・全紀錄</div>
    <h1>ARCHIVE</h1>
    <p>手帳、劇單與快門,三本各自的日記，收在同一個封面底下。</p>
  </div>

  <nav class="index">
    <a class="entry" data-x="diary" href="https://yician0830.github.io/mystar-/">
      <span class="num">01</span>
      <span class="body">
        <div class="title"><span class="dot"></span>推し手帳</div>
        <div class="desc">行程、記帳、應援與小卡——追星生活的每日記事本</div>
      </span>
      <span class="arrow">→</span>
    </a>

    <a class="entry" data-x="drama" href="https://yician0830.github.io/mystar-/drama/">
      <span class="num">02</span>
      <span class="body">
        <div class="title"><span class="dot"></span>追劇紀錄</div>
        <div class="desc">進度、心得與評分——正在追的每一部劇</div>
      </span>
      <span class="arrow">→</span>
    </a>

    <a class="entry" data-x="photo" href="https://yician0830.github.io/mytourdiary/">
      <span class="num">03</span>
      <span class="body">
        <div class="title"><span class="dot"></span>_CHEMERA_ DIARY</div>
        <div class="desc">舞台、機場、見面會——巡演拍攝場次總覽相簿</div>
      </span>
      <span class="arrow">→</span>
    </a>
  </nav>

  <footer>UPDATED <span id="todayTag"></span></footer>
</div>

<script>
  (function(){
    try{
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if(prefersDark) document.documentElement.setAttribute('data-theme','dark');
    }catch(e){}
  })();
  var d = new Date();
  var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0');
  document.getElementById('issueTag').textContent = 'VOL. ' + y + '.' + m;
  document.getElementById('todayTag').textContent = y + '.' + m + '.' + String(d.getDate()).padStart(2,'0');
</script>
</body>
</html>
